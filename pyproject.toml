[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "senseai-viewer"
version = "0.1.0"
description = "Browse senseai-ingest recordings in a web browser: tick-file export to compact summaries, and a small FastAPI viewer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SenseAI Institute" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "boto3>=1.34",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "senseai-ingest @ git+https://github.com/senseai-institute/ingest.git",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "moto[s3]>=5.0",
  "playwright==1.56.0",
]

[project.scripts]
senseai-viewer = "senseai_viewer.cli:main"

[project.urls]
Homepage = "https://github.com/senseai-institute/viewer"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/senseai_viewer"]
# The built frontend is git-ignored but must ship in the wheel/image.
artifacts = ["src/senseai_viewer/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=senseai_viewer --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
omit = ["*/static/*"]
