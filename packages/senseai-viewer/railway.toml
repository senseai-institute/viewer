#
# Railway service config used when the service's Root Directory is packages/senseai-viewer.
# With no Root Directory set, the repo-root railway.json and Dockerfile build the same app.
# Variables are documented in .env.example; none are required for the demo.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
