[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "senseai-viewer"
version = "0.2.0"
description = "Web UX of the SenseAI perception layer: replay, compare and review what a pipeline senses, predicts and reacts to."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SenseAI Institute" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "h5py>=3.10",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The one-click POC's S3 access (instance role). Installed by deploy/setup_ec2.sh.
s3 = ["boto3>=1.34"]
dev = [
  "boto3>=1.34",
  "moto[s3]>=5.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "playwright==1.56.0",
  "pillow>=10.0",
]

[project.scripts]
senseai-viewer = "senseai_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["server/senseai_viewer"]
# The built web app is git-ignored but must ship in the wheel and image.
artifacts = ["server/senseai_viewer/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tests/fakestack.py" = ["D", "E501"]  # fake CLIs written out as script text
"examples/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["server"]
mypy_path = "server"

[[tool.mypy.overrides]]
module = ["yaml", "h5py", "h5py.*", "boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=senseai_viewer --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
omit = ["*/static/*"]
